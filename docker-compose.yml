# TestForge production stack.
#
#   ./scripts/init-env.sh            # one-time: writes .env with random secrets
#   docker compose up -d --build     # redis + api + worker
#   docker compose --profile monitoring up -d   # + prometheus + grafana
#   docker compose up -d --scale worker=4       # more worker capacity
#
name: testforge

x-app: &app
  build: .
  image: testforge:latest
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
  environment: &app-env
    NODE_ENV: production
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set (run ./scripts/init-env.sh)}
    API_AUTH_ENABLED: ${API_AUTH_ENABLED:-true}
    API_KEYS: ${API_KEYS:-}
    ADMIN_API_KEYS: ${ADMIN_API_KEYS:-}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Quotas (per API key; admins exempt) and shared rate limits
    QUOTA_MAX_ACTIVE_JOBS: ${QUOTA_MAX_ACTIVE_JOBS:-100}
    QUOTA_MAX_JOBS_PER_DAY: ${QUOTA_MAX_JOBS_PER_DAY:-0}
    RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
    SUBMIT_RATE_LIMIT_MAX: ${SUBMIT_RATE_LIMIT_MAX:-60}
    # Webhooks
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    WEBHOOK_URLS: ${WEBHOOK_URLS:-}
    WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}
    WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
    # Artifacts
    ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-10485760}
    ARTIFACT_MAX_FILES: ${ARTIFACT_MAX_FILES:-50}
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - backend

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # BullMQ requires noeviction: an evicting policy silently deletes queue keys.
    command: >
      sh -c 'exec redis-server --appendonly yes --maxmemory-policy noeviction
      --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *app
    environment:
      <<: *app-env
      ENGINE_MODE: api
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-3000}:3000"
    stop_grace_period: 20s

  worker:
    <<: *app
    environment:
      <<: *app-env
      ENGINE_MODE: worker
      WORKER_EXECUTOR: docker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_MAX_MEMORY_MB: ${WORKER_MAX_MEMORY_MB:-512}
      WORKER_CPUS: ${WORKER_CPUS:-1}
      WORKER_NETWORK_ENABLED: ${WORKER_NETWORK_ENABLED:-false}
      DOCKER_RUNTIME: ${DOCKER_RUNTIME:-}
      SHUTDOWN_TIMEOUT: "45000"
    # The worker launches each job as a sibling container on the host's Docker
    # daemon. Only the worker gets the socket; the public-facing API never does.
    # Anyone who can control the worker process controls the host: keep it on
    # a dedicated machine/VM, and consider DOCKER_RUNTIME=runsc (gVisor).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    stop_grace_period: 60s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/testforge.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - backend

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - backend

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  backend:
