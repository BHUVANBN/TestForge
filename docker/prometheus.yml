global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: testforge

scrape_configs:
  # Metrics are served on the internal METRICS_PORT (9100), never on the public API port.
  - job_name: testforge-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9100
        refresh_interval: 30s

  # DNS discovery picks up every replica after `--scale worker=N`.
  - job_name: testforge-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
